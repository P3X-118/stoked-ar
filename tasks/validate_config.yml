---

- name: Fail if required Stoked settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
    quiet: "{{ item.quiet | default(false) }}"
  when: "item.when | bool"
  with_items:
    - name: stoked_hostname
      when: "{{ stoked_hostname == '' }}"
