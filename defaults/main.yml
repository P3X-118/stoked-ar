stoked_voice_ingress_container_image: "docker.io/legitservices/stoked-voice-ingress:{{ stoked_version }}"
stoked_voice_ingress_container_image_force_pull: "{{ stoked_voice_ingress_container_image.endswith(':latest') }}"
stoked_voice_ingress_container_network: "{{ stoked_container_network }}"
stoked_voice_ingress_container_extra_arguments: []

stoked_voice_ingress_systemd_required_services_list:
  - "{{ sysd_docker_service }}"
  - "{{ stoked_mongodb_identifier }}.service"
  - "{{ stoked_rabbitmq_identifier }}.service"
