---

########################################################################
# Common
########################################################################

stoked_enabled: true

stoked_identifier: stoked

stoked_base_path: "/{{ stoked_identifier }}"

stoked_version: sgc

stoked_uid: ""
stoked_gid: ""

stoked_scheme: https
stoked_hostname: ""

stoked_video_enabled: true

########################################################################
# Secrets
########################################################################

# VAPID keys (generated at install time if empty, persisted to disk)
stoked_vapid_private_key: ""
stoked_vapid_public_key: ""

# Files encryption key (base64-encoded 32 bytes)
stoked_files_encryption_key: ""

# LiveKit key/secret pair
stoked_livekit_key: ""
stoked_livekit_secret: ""

########################################################################
# Email / SMTP (signup verification)
########################################################################
# Email verification is ENABLED automatically when stoked_smtp_host is
# non-empty (authifier: EmailVerificationConfig::Enabled). Leave host empty
# to skip verification entirely (signups auto-verify, no mail is sent).
stoked_smtp_host: ""
stoked_smtp_port: 465
stoked_smtp_username: ""
stoked_smtp_password: ""
stoked_smtp_from_address: ""
stoked_smtp_reply_to: ""
# Transport (authifier crates/authifier/src/config/email_verification.rs):
#   use_starttls=true            -> STARTTLS relay  (use port 587)
#   use_starttls=false (default) -> implicit TLS    (use port 465)
#   use_tls=false                -> DISABLES TLS (plaintext) -- DEV/TEST ONLY.
# Never set use_tls=false in production.
stoked_smtp_use_tls: true
stoked_smtp_use_starttls: false

# Registration: open by default. Set true to require an invite code.
stoked_registration_invite_only: false

########################################################################
# Authentik / OIDC SSO login (native delta /auth/oidc)
########################################################################
# When stoked_oidc_enabled is true, [api.oidc] is rendered into Revolt.toml and
# delta offers /auth/oidc/{login,callback}. Requires an OIDC-capable image (the
# routes are compiled in). client_secret is derived from sgc_pgsk in SGC
# group_vars (salt 'stoked.oidc', mirroring the Owncast radio-chat convention);
# leave the placeholder empty here. The IdP host may need a container
# --add-host (set via stoked_api_container_extra_arguments) when it is only
# reachable over a private mesh.
stoked_oidc_enabled: false
stoked_oidc_issuer: ""
stoked_oidc_client_id: "stoked"
stoked_oidc_client_secret: ""
stoked_oidc_scopes: "openid profile email"
stoked_oidc_redirect_uri: "{{ stoked_scheme }}://{{ stoked_hostname }}/api/auth/oidc/callback"

########################################################################
# Network
########################################################################

stoked_container_network: "{{ stoked_identifier }}"

########################################################################
# MongoDB (internal)
########################################################################

stoked_mongodb_enabled: true
stoked_mongodb_identifier: "{{ stoked_identifier }}-mongodb"
stoked_mongodb_base_path: "{{ stoked_base_path }}/mongodb"
stoked_mongodb_data_path: "{{ stoked_mongodb_base_path }}/data"
stoked_mongodb_container_image: "docker.io/mongo"
stoked_mongodb_container_image_force_pull: false
stoked_mongodb_container_network: "{{ stoked_container_network }}"
stoked_mongodb_hostname: "{{ stoked_mongodb_identifier }}"

stoked_mongodb_systemd_required_services_list:
  - "{{ sysd_docker_service }}"

########################################################################
# Redis/KeyDB (internal)
########################################################################

stoked_redis_enabled: true
stoked_redis_identifier: "{{ stoked_identifier }}-redis"
stoked_redis_base_path: "{{ stoked_base_path }}/redis"
stoked_redis_container_image: "docker.io/eqalpha/keydb"
stoked_redis_container_image_force_pull: false
stoked_redis_container_network: "{{ stoked_container_network }}"
stoked_redis_hostname: "{{ stoked_redis_identifier }}"

stoked_redis_systemd_required_services_list:
